services:
  mysql:
    image: mysql:8.4
    container_name: teampulse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: local_mysql_root_password
      MYSQL_DATABASE: teampulse_identity
      MYSQL_USER: teampulse_app
      MYSQL_PASSWORD: local_teampulse_password
    ports:
      - "3306:3306"
    volumes:
      - teampulse-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal_mysql_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  teampulse-mysql-data:
