services:
  mysql:
    image: mysql:8.4
    container_name: teampulse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: local_mysql_root_password
      MYSQL_DATABASE: teampulse_identity
      MYSQL_USER: teampulse_app
      MYSQL_PASSWORD: local_teampulse_password
    ports:
      - "3306:3306"
    volumes:
      - teampulse-mysql-data:/var/lib/mysql
      - ./infra/mysql/init/01-habit-database.sql:/docker-entrypoint-initdb.d/01-habit-database.sql:ro
      - ./infra/mysql/init/02-challenge-database.sql:/docker-entrypoint-initdb.d/02-challenge-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal_mysql_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: teampulse-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: teampulse
      RABBITMQ_DEFAULT_PASS: local_rabbitmq_password
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - teampulse-rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  teampulse-mysql-data:
  teampulse-rabbitmq-data:
