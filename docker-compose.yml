services:
  postgres:
    image: postgres:16-alpine
    container_name: teampulse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - teampulse-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  teampulse-postgres-data: