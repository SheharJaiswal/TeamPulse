AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  TeamPulse Identity employee-lifecycle event fan-out. Creates a custom EventBridge
  bus, least-privilege PutEvents attachment for an existing Identity workload role,
  five service-owned SQS projection queues, per-target delivery DLQs and alarms.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Identity event producer
        Parameters:
          - EnvironmentName
          - EventBusName
          - IdentityWorkloadRoleName
          - ResourceNamePrefix
      - Label:
          default: Delivery and operations
        Parameters:
          - TargetRetryMaximumAgeSeconds
          - TargetRetryMaximumAttempts
          - TargetQueueRetentionSeconds
          - DeadLetterRetentionSeconds
          - TargetQueueAgeThresholdSeconds
          - AlarmNotificationTopicArn
    ParameterLabels:
      EventBusName:
        default: Custom EventBridge bus name
      IdentityWorkloadRoleName:
        default: Existing Identity workload IAM role name
      TargetQueueAgeThresholdSeconds:
        default: Approved SQS oldest-message age threshold (seconds)

Parameters:
  EnvironmentName:
    Type: String
    MinLength: 1
    MaxLength: 12
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Short deployment environment identifier used in resource names and tags.
  EventBusName:
    Type: String
    MinLength: 1
    MaxLength: 256
    AllowedPattern: '^[A-Za-z0-9._/-]+$'
    Description: Required custom EventBridge bus name; no account-specific name is hard-coded.
  IdentityWorkloadRoleName:
    Type: String
    MinLength: 1
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]+$'
    Description: Existing same-account Identity ECS task or instance role name. Its trust policy is managed by the compute deployment.
  ResourceNamePrefix:
    Type: String
    Default: teampulse
    MinLength: 1
    MaxLength: 20
    AllowedPattern: '^[A-Za-z0-9_-]+$'
    Description: Prefix for rule and SQS resource names.
  TargetRetryMaximumAgeSeconds:
    Type: Number
    Default: 86400
    MinValue: 60
    MaxValue: 86400
    Description: EventBridge maximum target-event age before sending to its target DLQ.
  TargetRetryMaximumAttempts:
    Type: Number
    Default: 185
    MinValue: 0
    MaxValue: 185
    Description: EventBridge maximum target delivery attempts before sending to its target DLQ.
  TargetQueueRetentionSeconds:
    Type: Number
    Default: 345600
    MinValue: 60
    MaxValue: 1209600
    Description: SQS retention for service projection queues (default four days).
  DeadLetterRetentionSeconds:
    Type: Number
    Default: 1209600
    MinValue: 60
    MaxValue: 1209600
    Description: SQS retention for EventBridge target-delivery DLQs (default fourteen days).
  TargetQueueAgeThresholdSeconds:
    Type: Number
    MinValue: 60
    MaxValue: 86400
    Description: Required operator-approved oldest-message alarm threshold; no SLO is invented by this template.
  AlarmNotificationTopicArn:
    Type: String
    Default: ''
    Description: Optional existing same-account, same-region SNS topic ARN for alarm and OK notifications. Omit for alarms without actions.

Conditions:
  HasAlarmNotificationTopic: !Not [!Equals [!Ref AlarmNotificationTopicArn, '']]

Resources:
  IdentityLifecycleEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Ref EventBusName
      Description: !Sub 'TeamPulse domain events (${EnvironmentName})'
      Tags:
        - Key: Project
          Value: TeamPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: Identity

  HabitEmployeeStatusQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-habit-employee-status'
      MessageRetentionPeriod: !Ref TargetQueueRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: TeamPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ServiceOwner
          Value: Habit
        - Key: Purpose
          Value: EmployeeStatusProjection

  HabitEventBridgeTargetDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-habit-eventbridge-target-dlq'
      MessageRetentionPeriod: !Ref DeadLetterRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: TeamPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ServiceOwner
          Value: Habit
        - Key: Purpose
          Value: EventBridgeTargetDeliveryDlq

  ChallengeEmployeeStatusQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-challenge-employee-status'
      MessageRetentionPeriod: !Ref TargetQueueRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: TeamPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ServiceOwner
          Value: Challenge
        - Key: Purpose
          Value: EmployeeStatusProjection

  ChallengeEventBridgeTargetDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-challenge-eventbridge-target-dlq'
      MessageRetentionPeriod: !Ref DeadLetterRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: TeamPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ServiceOwner
          Value: Challenge
        - Key: Purpose
          Value: EventBridgeTargetDeliveryDlq

  EventTrackingEmployeeStatusQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-event-tracking-employee-status'
      MessageRetentionPeriod: !Ref TargetQueueRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: TeamPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ServiceOwner
          Value: EventTracking
        - Key: Purpose
          Value: EmployeeStatusProjection

  EventTrackingEventBridgeTargetDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-event-tracking-eventbridge-target-dlq'
      MessageRetentionPeriod: !Ref DeadLetterRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: TeamPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ServiceOwner
          Value: EventTracking
        - Key: Purpose
          Value: EventBridgeTargetDeliveryDlq

  InsightEmployeeStatusQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-insight-employee-status'
      MessageRetentionPeriod: !Ref TargetQueueRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: TeamPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ServiceOwner
          Value: Insight
        - Key: Purpose
          Value: EmployeeStatusProjection

  InsightEventBridgeTargetDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-insight-eventbridge-target-dlq'
      MessageRetentionPeriod: !Ref DeadLetterRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: TeamPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ServiceOwner
          Value: Insight
        - Key: Purpose
          Value: EventBridgeTargetDeliveryDlq

  NotificationEmployeeStatusQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-notification-employee-status'
      MessageRetentionPeriod: !Ref TargetQueueRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: TeamPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ServiceOwner
          Value: Notification
        - Key: Purpose
          Value: EmployeeStatusProjection

  NotificationEventBridgeTargetDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-notification-eventbridge-target-dlq'
      MessageRetentionPeriod: !Ref DeadLetterRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: TeamPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ServiceOwner
          Value: Notification
        - Key: Purpose
          Value: EventBridgeTargetDeliveryDlq
  HabitQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref HabitEmployeeStatusQueue
        - !Ref HabitEventBridgeTargetDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeToHabitProjectionQueue
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt HabitEmployeeStatusQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${EventBusName}/${ResourceNamePrefix}-${EnvironmentName}-employee-lifecycle'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowEventBridgeToHabitTargetDlq
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt HabitEventBridgeTargetDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${EventBusName}/${ResourceNamePrefix}-${EnvironmentName}-employee-lifecycle'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ChallengeQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ChallengeEmployeeStatusQueue
        - !Ref ChallengeEventBridgeTargetDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeToChallengeProjectionQueue
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ChallengeEmployeeStatusQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${EventBusName}/${ResourceNamePrefix}-${EnvironmentName}-employee-lifecycle'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowEventBridgeToChallengeTargetDlq
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ChallengeEventBridgeTargetDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${EventBusName}/${ResourceNamePrefix}-${EnvironmentName}-employee-lifecycle'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  EventTrackingQueuePolicy:
