        - !Ref InsightEmployeeStatusQueue
        - !Ref InsightEventBridgeTargetDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeToInsightProjectionQueue
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt InsightEmployeeStatusQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${EventBusName}/${ResourceNamePrefix}-${EnvironmentName}-employee-lifecycle'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowEventBridgeToInsightTargetDlq
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt InsightEventBridgeTargetDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${EventBusName}/${ResourceNamePrefix}-${EnvironmentName}-employee-lifecycle'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotificationEmployeeStatusQueue
        - !Ref NotificationEventBridgeTargetDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeToNotificationProjectionQueue
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationEmployeeStatusQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${EventBusName}/${ResourceNamePrefix}-${EnvironmentName}-employee-lifecycle'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowEventBridgeToNotificationTargetDlq
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationEventBridgeTargetDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${EventBusName}/${ResourceNamePrefix}-${EnvironmentName}-employee-lifecycle'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
  EmployeeLifecycleProjectionRule:
    Type: AWS::Events::Rule
    DependsOn:
      - HabitQueuePolicy
      - ChallengeQueuePolicy
      - EventTrackingQueuePolicy
      - InsightQueuePolicy
      - NotificationQueuePolicy
    Properties:
      Name: !Sub '${ResourceNamePrefix}-${EnvironmentName}-employee-lifecycle'
      Description: Routes Identity employee activation/deactivation events to the five service-owned status projections.
      EventBusName: !Ref IdentityLifecycleEventBus
      State: ENABLED
      EventPattern:
        source:
          - teampulse.identity
        detail-type:
          - EmployeeDeactivated
          - EmployeeReactivated
        detail:
          eventType:
            - EmployeeDeactivated
            - EmployeeReactivated
          schemaVersion:
            - 1
      Targets:
        - Arn: !GetAtt HabitEmployeeStatusQueue.Arn
          Id: HabitEmployeeStatusProjection
          DeadLetterConfig:
            Arn: !GetAtt HabitEventBridgeTargetDlq.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: !Ref TargetRetryMaximumAgeSeconds
            MaximumRetryAttempts: !Ref TargetRetryMaximumAttempts
        - Arn: !GetAtt ChallengeEmployeeStatusQueue.Arn
          Id: ChallengeEmployeeStatusProjection
          DeadLetterConfig:
            Arn: !GetAtt ChallengeEventBridgeTargetDlq.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: !Ref TargetRetryMaximumAgeSeconds
            MaximumRetryAttempts: !Ref TargetRetryMaximumAttempts
        - Arn: !GetAtt EventTrackingEmployeeStatusQueue.Arn
          Id: EventTrackingEmployeeStatusProjection
          DeadLetterConfig:
            Arn: !GetAtt EventTrackingEventBridgeTargetDlq.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: !Ref TargetRetryMaximumAgeSeconds
            MaximumRetryAttempts: !Ref TargetRetryMaximumAttempts
        - Arn: !GetAtt InsightEmployeeStatusQueue.Arn
          Id: InsightEmployeeStatusProjection
          DeadLetterConfig:
            Arn: !GetAtt InsightEventBridgeTargetDlq.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: !Ref TargetRetryMaximumAgeSeconds
            MaximumRetryAttempts: !Ref TargetRetryMaximumAttempts
        - Arn: !GetAtt NotificationEmployeeStatusQueue.Arn
          Id: NotificationEmployeeStatusProjection
          DeadLetterConfig:
            Arn: !GetAtt NotificationEventBridgeTargetDlq.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: !Ref TargetRetryMaximumAgeSeconds
            MaximumRetryAttempts: !Ref TargetRetryMaximumAttempts
      Tags:
        - Key: Project
          Value: TeamPulse
        - Key: Environment
          Value: !Ref EnvironmentName

  IdentityPutEventsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub 'TeamPulseIdentityPutEvents-${EnvironmentName}'
      Roles:
        - !Ref IdentityWorkloadRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PutLifecycleEventsToTeamPulseBus
            Effect: Allow
            Action:
              - events:PutEvents
            Resource: !GetAtt IdentityLifecycleEventBus.Arn

  EventBridgeDlqWriteFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-eventbridge-dlq-write-failures'
      AlarmDescription: Alarm when EventBridge cannot write failed target deliveries to the configured SQS DLQ.
      Namespace: AWS/Events
      MetricName: InvocationsFailedToBeSentToDlq
      Dimensions:
        - Name: EventBusName
          Value: !Ref IdentityLifecycleEventBus
        - Name: RuleName
          Value: !Sub '${ResourceNamePrefix}-${EnvironmentName}-employee-lifecycle'
      Statistic: Sum
      Unit: Count
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  HabitDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-habit-eventbridge-dlq-depth'
      AlarmDescription: Alarm when EventBridge target-delivery failures are waiting in the Habit DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt HabitEventBridgeTargetDlq.QueueName
      Statistic: Maximum
      Unit: Count
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  HabitQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-habit-employee-status-queue-age'
      AlarmDescription: Alarm when the oldest Habit employee-status message exceeds the operator-approved age threshold.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt HabitEmployeeStatusQueue.QueueName
      Statistic: Maximum
      Unit: Seconds
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref TargetQueueAgeThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  ChallengeDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-challenge-eventbridge-dlq-depth'
      AlarmDescription: Alarm when EventBridge target-delivery failures are waiting in the Challenge DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ChallengeEventBridgeTargetDlq.QueueName
      Statistic: Maximum
      Unit: Count
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  ChallengeQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-challenge-employee-status-queue-age'
      AlarmDescription: Alarm when the oldest Challenge employee-status message exceeds the operator-approved age threshold.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ChallengeEmployeeStatusQueue.QueueName
      Statistic: Maximum
      Unit: Seconds
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref TargetQueueAgeThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  EventTrackingDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-event-tracking-eventbridge-dlq-depth'
      AlarmDescription: Alarm when EventBridge target-delivery failures are waiting in the EventTracking DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventTrackingEventBridgeTargetDlq.QueueName
      Statistic: Maximum
      Unit: Count
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  EventTrackingQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-event-tracking-employee-status-queue-age'
      AlarmDescription: Alarm when the oldest EventTracking employee-status message exceeds the operator-approved age threshold.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventTrackingEmployeeStatusQueue.QueueName
      Statistic: Maximum
      Unit: Seconds
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref TargetQueueAgeThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  InsightDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-insight-eventbridge-dlq-depth'
      AlarmDescription: Alarm when EventBridge target-delivery failures are waiting in the Insight DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt InsightEventBridgeTargetDlq.QueueName
      Statistic: Maximum
      Unit: Count
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  InsightQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-insight-employee-status-queue-age'
      AlarmDescription: Alarm when the oldest Insight employee-status message exceeds the operator-approved age threshold.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt InsightEmployeeStatusQueue.QueueName
      Statistic: Maximum
      Unit: Seconds
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref TargetQueueAgeThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  NotificationDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-notification-eventbridge-dlq-depth'
      AlarmDescription: Alarm when EventBridge target-delivery failures are waiting in the Notification DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationEventBridgeTargetDlq.QueueName
      Statistic: Maximum
      Unit: Count
