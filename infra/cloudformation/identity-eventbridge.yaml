      AlarmActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  NotificationQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourceNamePrefix}-${EnvironmentName}-notification-employee-status-queue-age'
      AlarmDescription: Alarm when the oldest Notification employee-status message exceeds the operator-approved age threshold.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationEmployeeStatusQueue.QueueName
      Statistic: Maximum
      Unit: Seconds
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref TargetQueueAgeThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmNotificationTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]
