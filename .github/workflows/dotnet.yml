name: .NET 8 CI

on:
  push:
    branches:
      - main
      - feature/backend-foundation
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
      - feature/backend-foundation
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Restore, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore backend/TeamPulse.sln

      - name: Build
        run: dotnet build backend/TeamPulse.sln --configuration Release --no-restore

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Start and verify local RabbitMQ topology
        run: |
          docker compose up -d --wait --wait-timeout 90 rabbitmq
          queues="$(docker compose exec -T rabbitmq rabbitmqctl list_queues name --no-table-headers)"
          for queue in teampulse.habit.events teampulse.habit.events.dlq teampulse.challenge.events teampulse.event-tracking.events teampulse.insight.events teampulse.notification.events; do
            if ! grep -Fxq "$queue" <<< "$queues"; then
              echo "Expected local RabbitMQ queue not found: $queue"
              printf '%s\n' "$queues"
              exit 1
            fi
          done
          exchanges="$(docker compose exec -T rabbitmq rabbitmqctl list_exchanges name type --no-table-headers)"
          if ! grep -Fq "teampulse.domain.events" <<< "$exchanges" || ! grep -Fq "teampulse.domain.events.dlx" <<< "$exchanges"; then
            echo "Expected local RabbitMQ domain or Habit dead-letter exchange not found."
            printf '%s\n' "$exchanges"
            exit 1
          fi

      - name: Validate local RabbitMQ topology contract
        run: python -m unittest discover -s infra/rabbitmq/tests -v

      - name: Pull pinned MySQL 8.4 test image
        run: docker pull mysql:8.4

      - name: Pull pinned DynamoDB Local test image
        run: docker pull amazon/dynamodb-local:2.5.2

      - name: Pull RabbitMQ queue-migration Testcontainers image
        run: docker pull rabbitmq:4.0-alpine

      - name: Test (includes MySQL 8.4 and RabbitMQ Testcontainers integration tests)
        run: dotnet test backend/TeamPulse.sln --configuration Release --no-build --logger "trx;LogFileName=teampulse-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teampulse-test-results
          path: "**/*.trx"
          if-no-files-found: ignore
