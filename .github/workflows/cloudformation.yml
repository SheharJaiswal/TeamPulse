name: CloudFormation lint

on:
  push:
    branches:
      - main
      - feature/backend-foundation
    paths:
      - 'infra/cloudformation/**'
      - '.github/workflows/cloudformation.yml'
  pull_request:
    branches:
      - main
      - feature/backend-foundation
    paths:
      - 'infra/cloudformation/**'
      - '.github/workflows/cloudformation.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Validate CloudFormation templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cfn-lint
        run: python -m pip install --upgrade pip cfn-lint
      - name: Lint CloudFormation templates
        run: cfn-lint --non-zero-exit-code warning infra/cloudformation/identity-eventbridge.yaml

      - name: Test CloudFormation resource and security contracts
        run: python -m unittest discover -s infra/cloudformation/tests -v
